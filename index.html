<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMM Panel Indonesia</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:linear-gradient(180deg,#06223d,#031728);
color:white;
overflow-x:hidden;
}

/* NAVBAR */

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 20px;
background:#0b2d4d;
}

.logo{
display:flex;
align-items:center;
gap:8px;
font-size:18px;
font-weight:bold;
}

.logo img{
width:36px;
}

.nav-icons{
display:flex;
gap:10px;
}

.icon-btn{
width:40px;
height:40px;
background:#143c64;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

/* HERO */

.hero{
text-align:center;
padding:40px 20px;
}

.badge{
display:inline-block;
background:#103a63;
padding:8px 18px;
border-radius:30px;
margin-bottom:15px;
font-size:13px;
}

.hero h1{
font-size:30px;
margin-bottom:10px;
}

.hero span{
color:#45b6ff;
}

.hero p{
font-size:14px;
color:#cdd9e5;
margin-bottom:25px;
}

/* LOGIN */

.login-box{
max-width:420px;
margin:auto;
}

.input{
display:flex;
align-items:center;
background:#0e2e4f;
border-radius:30px;
padding:14px;
margin-bottom:12px;
gap:10px;
}

.input input{
width:100%;
border:none;
outline:none;
background:none;
color:white;
}

.options{
display:flex;
justify-content:space-between;
font-size:13px;
margin-bottom:15px;
}

.btn-login{
width:100%;
padding:14px;
border:none;
border-radius:30px;
background:linear-gradient(90deg,#2ca7ff,#1977d0);
color:white;
font-size:16px;
cursor:pointer;
}

.btn-google{
width:100%;
margin-top:10px;
padding:14px;
border:none;
border-radius:30px;
background:#163e67;
color:white;
}

/* USERS */

.users{
display:flex;
align-items:center;
gap:12px;
padding:20px;
}

.avatars img{
width:40px;
height:40px;
border-radius:50%;
border:2px solid #021321;
margin-left:-10px;
}

.user-count{
font-size:24px;
font-weight:bold;
}

/* STATS */

.stats{
padding:20px;
}

.stats-card{
background:linear-gradient(180deg,#3bb5ff,#1f7bc8);
border-radius:20px;
padding:25px;
}

.stat{
margin-bottom:20px;
}

.stat-title{
font-size:14px;
opacity:0.9;
}

.stat-number{
font-size:32px;
font-weight:bold;
}

/* SLIDER */

.slider{
padding:20px;
}

.slide{
background:#2da9f0;
border-radius:20px;
padding:30px;
text-align:center;
}

.slide button{
margin-top:15px;
background:#ffb93c;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
}

/* PAYMENT */

.payment{
padding:20px;
}

.payment-grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:12px;
margin-top:15px;
}

.payment-grid img{
width:100%;
background:white;
border-radius:50%;
padding:8px;
}

/* CHAT */

.chat{
position:fixed;
bottom:20px;
right:20px;
width:60px;
height:60px;
background:#3cc4d9;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
box-shadow:0 0 15px rgba(0,0,0,0.5);
cursor:pointer;
}

/* ANIMATION */

.fade{
opacity:0;
transform:translateY(40px);
transition:0.6s;
}

.fade.show{
opacity:1;
transform:translateY(0);
}

</style>
</head>

<body>

<i class="fa fa-comment"></i>
</div>

<script>

/* COUNT ANIMATION */

function animateValue(id, start, end, duration){
let obj=document.getElementById(id)
let range=end-start
let startTime=null

function step(timestamp){
if(!startTime) startTime=timestamp
let progress=Math.min((timestamp-startTime)/duration,1)
obj.innerHTML=Math.floor(progress*range+start)
if(progress<1) requestAnimationFrame(step)
}

requestAnimationFrame(step)
}

animateValue("users",0,153240,2000)
animateValue("orders",0,6795454,2500)

/* SCROLL ANIMATION */

const fades=document.querySelectorAll('.fade')

function showOnScroll(){
const trigger=window.innerHeight*0.9

fades.forEach(el=>{
const top=el.getBoundingClientRect().top
if(top<trigger){
el.classList.add('show')
}
})
}

window.addEventListener('scroll',showOnScroll)
showOnScroll()

</script>

</body>
</html>
