<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SMM Panel Dashboard</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
display:flex;
background:#0f172a;
color:white;
}

/* SIDEBAR */

.sidebar{
width:250px;
background:#020617;
height:100vh;
padding:20px;
}

.sidebar h2{
margin-bottom:30px;
}

.sidebar a{
display:block;
padding:12px;
margin-bottom:8px;
color:white;
text-decoration:none;
border-radius:6px;
}

.sidebar a:hover{
background:#1e293b;
}

/* MAIN */

.main{
flex:1;
padding:20px;
}

/* TOPBAR */

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.profile{
display:flex;
align-items:center;
gap:15px;
}

.profile img{
border-radius:50%;
}

/* CARDS */

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
padding:20px;
border-radius:10px;
background:linear-gradient(135deg,#3b82f6,#2563eb);
}

.card h3{
font-size:14px;
opacity:0.8;
}

.card h2{
margin-top:10px;
}

/* CHART */

.chart-box{
background:#1e293b;
padding:20px;
border-radius:10px;
margin-bottom:30px;
}

/* TABLE */

.table-box{
background:#1e293b;
border-radius:10px;
padding:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#334155;
padding:12px;
}

td{
padding:12px;
border-bottom:1px solid #475569;
text-align:center;
}

.status-success{
color:#22c55e;
}

.status-pending{
color:#facc15;
}

</style>

</head>

<body onload="checkLogin()">

<!-- SIDEBAR -->

<div class="sidebar">

<h2>SMM PANEL</h2>

<a href="home.html"><i class="fa fa-home"></i> Dashboard</a>
<a href="neworder.html"><i class="fa fa-plus"></i> New Order</a>
<a href="services.html"><i class="fa fa-list"></i> Services</a>
<a href="orders.html"><i class="fa fa-box"></i> Orders</a>
<a href="addfund.html"><i class="fa fa-wallet"></i> Add Fund</a>
<a href="tickets.html"><i class="fa fa-ticket"></i> Tickets</a>
<a href="account.html"><i class="fa fa-user"></i> Account</a>

</div>

<!-- MAIN -->

<div class="main">

<div class="topbar">

<h1>Dashboard</h1>

<div class="profile">

<i class="fa fa-bell"></i>

<img src="https://i.pravatar.cc/40">

</div>

</div>

<!-- CARDS -->

<div class="cards">

<div class="card">
<h3>Balance</h3>
<h2>$120</h2>
</div>

<div class="card">
<h3>Total Orders</h3>
<h2>250</h2>
</div>

<div class="card">
<h3>Pending Orders</h3>
<h2>8</h2>
</div>

<div class="card">
<h3>Total Deposit</h3>
<h2>$540</h2>
</div>

</div>

<!-- CHART -->

<div class="chart-box">

<canvas id="ordersChart"></canvas>

</div>

<!-- TABLE -->

<div class="table-box">

<h2>Latest Orders</h2>

<table>

<tr>

<th>ID</th>
<th>Service</th>
<th>Quantity</th>
<th>Status</th>

</tr>

<tr>

<td>1023</td>
<td>Instagram Followers</td>
<td>1000</td>
<td class="status-success">Completed</td>

</tr>

<tr>

<td>1024</td>
<td>Tiktok Likes</td>
<td>500</td>
<td class="status-pending">Processing</td>

</tr>

</table>

</div>

</div>

<script src="script.js"></script>

<script>

const ctx=document.getElementById('ordersChart')

new Chart(ctx,{

type:'line',

data:{
labels:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],

datasets:[{

label:'Orders',

data:[10,20,15,30,25,40,35],

borderColor:'#3b82f6',

fill:false

}]

}

})

</script>

</body>
</html>
